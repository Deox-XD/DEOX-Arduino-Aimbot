[Settings]
; Arduino Leonardo COM port (check Device Manager → Ports)
; Example: COM3, COM4, COM5, etc.
COM-Port = YourArduinoCOMPort

[Aimbot]
; ───────────────────────────────────────────────────────────
; Aimbot automatically moves crosshair to detected targets
; ───────────────────────────────────────────────────────────

; Enable/disable aimbot functionality
Enabled = true

; Activation key (0x02 = Right Mouse Button)
; Common alternatives:
;   0x01 = Left Mouse Button
;   0x04 = Middle Mouse Button
;   0xA0 = Left Shift
;   0xA2 = Left Control
toggleKey = 0x02

; Aim speed multipliers (lower = smoother, higher = faster)
; Recommended range: 0.2 - 0.8
xSpeed = 0.4
ySpeed = 0.4

; Field of View dimensions (pixels from screen center)
; Smaller FOV = better performance, less detection range
; Larger FOV = wider detection, may impact accuracy
xFov = 100
yFov = 75

; Vertical pixel offset (positive = aim higher, negative = aim lower)
; Use this to adjust for headshots vs bodyshots
; Typical values: 5-15 for headshot bias
targetOffset = 8.0

[Triggerbot]
; ───────────────────────────────────────────────────────────
; Triggerbot automatically fires when target is centered
; ───────────────────────────────────────────────────────────

; Enable/disable triggerbot functionality
Enabled = true

; Activation key (0xA4 = Left Alt)
; Common alternatives:
;   0x01 = Left Mouse Button
;   0x10 = Shift
;   0x58 = X key
toggleKey = 0xA4

; Randomized delay before firing (milliseconds)
; Humanizes behavior to avoid detection patterns
; Lower values = faster reaction, higher risk
; Higher values = more human-like, safer
minDelay = 75
maxDelay = 125

; Trigger zone dimensions (pixels from center)
; Target must be within this box to trigger
; Smaller = more accurate, requires precise aim
; Larger = easier to trigger, less precise
xRange = 15
yRange = 15

; ═══════════════════════════════════════════════════════════
; TIPS & RECOMMENDATIONS:
;
; Performance Tuning:
;   - Start with default values
;   - Reduce FOV if experiencing lag
;   - Adjust speeds incrementally (±0.1)
;
; Accuracy Improvement:
;   - Lower aim speeds for precise tracking
;   - Smaller trigger zones for controlled firing
;   - Adjust targetOffset for consistent headshots
;
; Humanization:
;   - Increase delay range for natural behavior
;   - Use moderate aim speeds (0.3-0.5)
;   - Avoid maximum values for all settings
;
; ═══════════════════════════════════════════════════════════